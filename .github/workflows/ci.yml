name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Validate data & generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate curriculum.json and check generated files are current
        run: python3 scripts/build.py --check
      - name: Syntax-check the tracker
        run: |
          node --check assets/app.js
          node --check assets/curriculum.data.js
      - name: Check internal Markdown links
        run: python3 scripts/check_links.py
      - name: Smoke-test the tracker in a headless DOM
        run: |
          npm install --no-save --silent jsdom@24
          node scripts/smoke_test.js
