<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Mastery Plan 2026 - MAANG Interview Prep</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%234f98a3'>∑</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0f172a;
            --bg-alt: #1e293b;
            --bg-hover: #334155;
            --border: #475569;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            padding: 40px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        header p { color: #cffafe; font-size: 1.1em; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-alt);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 0.9em;
        }
        
        .progress-section {
            background: var(--bg-alt);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--bg);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        button:hover {
            background: var(--primary);
            opacity: 0.8;
            transform: translateY(-2px);
        }
        
        button.secondary {
            background: var(--bg-alt);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: var(--bg-alt);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .week-container {
            background: var(--bg-alt);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        
        .week-header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .week-header h2 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.4em;
        }
        
        .week-summary {
            color: var(--text-muted);
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .day-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            cursor: pointer;
        }
        
        .day-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
        }
        
        .day-card.completed {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
        }
        
        .day-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
        }
        
        .day-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text);
            padding-right: 40px;
        }
        
        .day-topic {
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .day-section {
            margin-bottom: 15px;
        }
        
        .day-section-title {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .resource-list {
            list-style: none;
        }
        
        .resource-item {
            padding: 8px 0;
            color: var(--text-muted);
            font-size: 0.9em;
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        
        .resource-item:last-child {
            border-bottom: none;
        }
        
        .resource-item::before {
            content: "→";
            color: var(--primary);
            font-weight: bold;
            min-width: 15px;
        }
        
        .resource-link {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }
        
        .resource-link:hover {
            text-decoration: underline;
        }
        
        .difficulty {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 5px;
        }
        
        .difficulty.easy { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .difficulty.medium { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .difficulty.hard { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .patterns-section {
            background: var(--bg-alt);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        
        .patterns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .pattern-card {
            background: var(--bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .pattern-name {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .pattern-desc {
            color: var(--text-muted);
            font-size: 0.9em;
            line-height: 1.5;
        }
        
        .resources-section {
            background: var(--bg-alt);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .resource-card {
            background: var(--bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        
        .resource-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
        }
        
        .resource-card h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .resource-card p {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .resource-card a {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .resource-card a:hover {
            background: var(--primary);
            color: white;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-alt);
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        
        .modal-close {
            float: right;
            cursor: pointer;
            font-size: 1.5em;
            color: var(--text-muted);
        }
        
        .modal-close:hover {
            color: var(--text);
        }
        
        .table-responsive {
            overflow-x: auto;
            margin: 20px 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        
        th {
            background: var(--bg);
            color: var(--primary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }
        
        tr:hover {
            background: rgba(59, 130, 246, 0.05);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .badge.core { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.stretch { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge.revision { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .days-grid { grid-template-columns: 1fr; }
            .patterns-grid { grid-template-columns: 1fr; }
            .resources-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 DSA Mastery Plan 2026</h1>
            <p>5-Month Journey to MAANG Interviews • 150 Days of Structured Learning</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">

                <div class="stat-label">Days Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="progressPct">0%</div>
                <div class="stat-label">Overall Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="currentWeek">1</div>
                <div class="stat-label">Current Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">Day Streak</div>
            </div>
        </div>
        
        <div class="progress-section">
            <h3 style="margin-bottom: 15px;">Overall Progress</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <span id="progressText">0 / 98 days</span>
        </div>
        
        <div class="controls">
            <button onclick="exportProgress()">📥 Export Progress</button>
            <button class="secondary" onclick="resetProgress()">↻ Reset All</button>
        </div>
        
        <div id="weeksContainer"></div>
        
        <div class="patterns-section">
            <h2 style="margin-bottom: 20px; color: var(--primary);">📋 DSA Patterns Quick Reference</h2>
            <div class="patterns-grid" id="patternsContainer"></div>
        </div>
        
        <div class="resources-section">
            <h2 style="margin-bottom: 20px; color: var(--primary);">📚 Learning Resources</h2>
            <div class="resources-grid" id="resourcesContainer"></div>
        </div>
    </div>
    
    <div class="modal" id="dayModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="dayDetails"></div>
        </div>
    </div>

                        {
                            day: 14,
                            title: "Week 2 Review & Mock",
                            topic: "Revision",
                            description: "Mock BS + SW problems, time and debug sessions",
                            concepts: ["Pattern Review"],
                            problems: [
                                { name: "Mixed Sorting & Search", difficulty: "medium", link: "https://leetcode.com/studyplan/leetcode-75" }
                            ],
                            resources: []
                        }
                    ]
                },
                {
                    title: "Weeks 5–6: Recursion & Backtracking",
                    summary: "Build recursive thinking: backtracking problems (subsets, permutations, N-Queens) and linked list manipulations.",
                    tag: "core",
                    days: [
                        {
                            day: 15,
                            title: "Recursion Fundamentals",
                            topic: "Recursion",
                            description: "Factorial, Fibonacci, power(x,n), tower of Hanoi",
                            concepts: ["Base Case", "Recurrence Relation", "Recursion Tree"],
                            problems: [
                                { name: "Factorial", difficulty: "easy", link: "https://www.geeksforgeeks.org/program-for-factorial-of-a-number/" },
                                { name: "Fibonacci Number", difficulty: "easy", link: "https://leetcode.com/problems/fibonacci-number/" },
                                { name: "Pow(x, n)", difficulty: "medium", link: "https://leetcode.com/problems/powx-n/" }
                            ],
                            resources: [
                                "https://takeuforward.org/recursion/ - Recursion Series"
                            ]
                        }
                    ]
                }
            ],
            patterns: [
                { name: "Sliding Window", concept: "Maintain window [l,r], shrink/expand based on constraint", use: "Contiguous subarray/substring with constraint", example: "Longest Substring Without Repeat" },
                { name: "Two Pointers", concept: "L and R pointers moving toward/away from each other", use: "Sorted arrays, pairs, palindromes", example: "3Sum, Container With Water" },
                { name: "Prefix Sum", concept: "presum[i] = sum(arr[0..i]), query in O(1)", use: "Range sum queries, subarray problems", example: "Subarray Sum Equals K" },
                { name: "Binary Search", concept: "Halve search space each step — O(log n)", use: "Sorted input, monotonic answer space", example: "Search in Rotated Array" },
                { name: "DFS", concept: "Stack/recursion depth-first exploration", use: "Connectivity, paths, all solutions", example: "Number of Islands" },
                { name: "BFS", concept: "Queue level-order traversal", use: "Shortest path, level traversal", example: "Word Ladder" },
                { name: "Monotonic Stack", concept: "Keep stack elements in monotone order (inc/dec)", use: "Next greater element, span problems", example: "Daily Temperatures" },
                { name: "Union-Find (DSU)", concept: "Track connected components with path compression", use: "Cycle detection, dynamic connectivity", example: "Redundant Connection" }
            ],
            resources: [
                {
                    name: "Striver's A2Z DSA Course",
                    description: "Complete video course from basics to advanced DSA with detailed explanations and solutions.",
                    url: "https://takeuforward.org/dsa/strivers-a2z-dsa-course-sheet"
                },
                {
                    name: "NeetCode 150",
                    description: "150 curated LeetCode problems with video solutions organized by pattern and difficulty.",
                    url: "https://neetcode.io/practice"
                },
                {
                    name: "Blind 75 Curated List",
                    description: "Essential 75 problems covering patterns that appear repeatedly in FAANG interviews.",
                    url: "https://leetcode.com/studyplan/leetcode-75"
                },
                {
                    name: "LeetCode Platform",
                    description: "Premier coding practice platform with 3000+ problems, discussions, and company tags.",
                    url: "https://leetcode.com"
                },
                {
                    name: "GeeksforGeeks SDE Sheet",
                    description: "Curated checklist of must-do coding interview questions from top companies.",
                    url: "https://www.geeksforgeeks.org/must-do-coding-questions-for-companies-like-amazon-microsoft-adobe/"
                },
                {
                    name: "Love Babbar 450 Sheet",
                    description: "Comprehensive 450 problem collection to master all DSA concepts thoroughly.",
                    url: "https://450dsa.com/"
                }
            ]
        };
        
        let state = {
            completed: {},
            view: 'grid'
        };
        
        function loadState() {
            const saved = localStorage.getItem('dsa-state');
            if (saved) state = JSON.parse(saved);
        }
        
        function saveState() {
            localStorage.setItem('dsa-state', JSON.stringify(state));
        }
        
        function renderWeeks() {
            const container = document.getElementById('weeksContainer');
            container.innerHTML = '';
            
            DSA_DATA.weeks.forEach((week, weekIdx) => {
                const weekEl = document.createElement('div');
                weekEl.className = 'week-container';
                
                const daysHTML = week.days.map(day => `
                    <div class="day-card ${state.completed[day.day] ? 'completed' : ''}" onclick="openDayModal(${day.day})">
                        <input type="checkbox" class="day-checkbox" 
                            onchange="toggleDay(${day.day}, event)" 
                            ${state.completed[day.day] ? 'checked' : ''}
                            onclick="event.stopPropagation()">
                        <div class="day-title">Day ${day.day}</div>
                        <div class="day-topic">${day.topic}</div>
                        <div class="day-section">
                            <div class="day-section-title">Focus</div>
                            <p style="color: var(--text-muted); font-size: 0.9em;">${day.description}</p>
                        </div>
                        <div class="day-section">
                            <div class="day-section-title">Concepts (${day.concepts.length})</div>
                            <ul class="resource-list">
                                ${day.concepts.slice(0, 2).map(c => `<li class="resource-item">${c}</li>`).join('')}
                                ${day.concepts.length > 2 ? `<li class="resource-item">+${day.concepts.length - 2} more</li>` : ''}
                            </ul>
                        </div>
                        <div class="day-section">
                            <div class="day-section-title">Problems (${day.problems.length})</div>
                            <ul class="resource-list">
                                ${day.problems.slice(0, 2).map(p => `<li class="resource-item">${p.name} <span class="difficulty ${p.difficulty}">${p.difficulty}</span></li>`).join('')}
                                ${day.problems.length > 2 ? `<li class="resource-item">+${day.problems.length - 2} more problems</li>` : ''}
                            </ul>
                        </div>
                    </div>
                `).join('');
                
                weekEl.innerHTML = `
                    <div class="week-header">
                        <h2>${week.title} <span class="badge ${week.tag}">${week.tag}</span></h2>
                        <p class="week-summary">${week.summary}</p>
                    </div>
                    <div class="days-grid">
                        ${week.days.length > 0 ? daysHTML : '<div class="empty-state">Days coming soon...</div>'}
                    </div>
                `;
                
                container.appendChild(weekEl);
            });
            
            updateStats();
        }
        
        function renderPatterns() {
            const container = document.getElementById('patternsContainer');
            container.innerHTML = DSA_DATA.patterns.map(p => `
                <div class="pattern-card">
                    <div class="pattern-name">📌 ${p.name}</div>
                    <div class="pattern-desc">
                        <strong>Core Idea:</strong><br>${p.concept}<br><br>
                        <strong>When to Use:</strong><br>${p.use}<br><br>
                        <strong>Example:</strong><br>${p.example}
                    </div>
                </div>
            `).join('');
        }
        
        function renderResources() {
            const container = document.getElementById('resourcesContainer');
            container.innerHTML = DSA_DATA.resources.map(r => `
                <div class="resource-card">
                    <h3>🔗 ${r.name}</h3>
                    <p>${r.description}</p>
                    <a href="${r.url}" target="_blank">Visit Resource →</a>
                </div>
            `).join('');
        }
        
        function toggleDay(dayNum, event) {
            event.stopPropagation();
            state.completed[dayNum] = !state.completed[dayNum];
            saveState();
            renderWeeks();
        }
        
        function openDayModal(dayNum) {
            const dayData = DSA_DATA.weeks.flatMap(w => w.days).find(d => d.day === dayNum);
            if (!dayData) return;
            
            const detailsHTML = `
                <h2>Day ${dayNum}: ${dayData.title}</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.95em;">${dayData.description}</p>
                
                <h3 style="color: var(--primary); margin-top: 20px; margin-bottom: 10px; font-size: 1.1em;">📚 Key Concepts (${dayData.concepts.length})</h3>
                <ul class="resource-list">
                    ${dayData.concepts.map(c => `<li class="resource-item"><strong>${c}</strong></li>`).join('')}
                </ul>
                
                <h3 style="color: var(--primary); margin-top: 20px; margin-bottom: 10px; font-size: 1.1em;">🎯 Problems to Solve (${dayData.problems.length})</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Problem Name</th>
                                <th>Level</th>
                                <th>Link</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${dayData.problems.map(p => `
                                <tr>
                                    <td>${p.name}</td>
                                    <td><span class="difficulty ${p.difficulty}">${p.difficulty.toUpperCase()}</span></td>
                                    <td>
                                        ${p.link && p.link !== '#' ? `<a href="${p.link}" target="_blank" class="resource-link" style="font-weight:700;">Solve →</a>` : '—'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                
                ${dayData.resources.length > 0 ? `
                    <h3 style="color: var(--primary); margin-top: 20px; margin-bottom: 10px; font-size: 1.1em;">🔗 Learning Resources (${dayData.resources.length})</h3>
                    <ul class="resource-list">
                        ${dayData.resources.map(r => {
                            const [text, link] = r.includes(' - ') ? r.split(' - ') : [r, '#'];
                            return `<li class="resource-item">
                                ${link && link !== '#' ? `<a href="${link}" target="_blank" class="resource-link">${text}</a>` : text}
                            </li>`;
                        }).join('')}
                    </ul>
                ` : ''}
            `;
            
            document.getElementById('dayDetails').innerHTML = detailsHTML;
            document.getElementById('dayModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('dayModal').classList.remove('active');
        }
        
        function updateStats() {
            const completed = Object.values(state.completed).filter(Boolean).length;
            const total = DSA_DATA.weeks.flatMap(w => w.days).length;
            const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById('daysCompleted').textContent = completed;
            document.getElementById('progressPct').textContent = pct + '%';
            document.getElementById('progressText').textContent = `${completed} / ${total} days`;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('currentWeek').textContent = Math.ceil((completed + 1) / 7);
        }
        
        function exportProgress() {
            const data = {
                exportDate: new Date().toISOString(),
                completed: state.completed,
                summary: {
                    days: Object.values(state.completed).filter(Boolean).length,
                    total: DSA_DATA.weeks.flatMap(w => w.days).length,
                    percentage: Math.round((Object.values(state.completed).filter(Boolean).length / DSA_DATA.weeks.flatMap(w => w.days).length) * 100)
                }
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dsa-progress-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }
        
        function resetProgress() {
            if (confirm('Are you sure? This will reset ALL your progress. This action cannot be undone.')) {
                state.completed = {};
                saveState();
                renderWeeks();
                alert('Progress reset successfully!');
            }
        }
        
        // Initialize
        loadState();
        renderWeeks();
        renderPatterns();
        renderResources();
        
        // Close modal on outside click
        document.getElementById('dayModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
